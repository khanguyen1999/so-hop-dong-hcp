name: Giữ Supabase không bị tạm dừng

# Gói Free của Supabase tạm dừng project sau 7 ngày không có hoạt động.
# Workflow này gọi vào database mỗi sáng một lần để project luôn chạy.
on:
  schedule:
    - cron: '17 1 * * *'   # 08:17 sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:         # cho phép bấm chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi database Supabase
        env:
          SUPABASE_URL: https://kbxnrkxfmobwisbzkehl.supabase.co
          SUPABASE_KEY: sb_publishable_XKsxbKUrbku72rlmG08-dA_5mf311dF   # publishable key, vốn đã công khai trong index.html
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" "$SUPABASE_URL/rest/v1/app_state?select=user_id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"; cat /tmp/out.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase trả về HTTP $code. Nếu project đã bị tạm dừng, vào supabase.com/dashboard bấm Resume project."
            exit 1
          fi
