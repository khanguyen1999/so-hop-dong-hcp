<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1215" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lịch Tâm Anh">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lịch khám Tâm Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: chọn phạm vi trước (cơ sở → khoa), rồi mới tới nội dung: dải ngày + timeline, hoặc danh bạ bác sĩ */
  --bg:#f3f5f7;
  --surface:#ffffff;
  --ink:#131820;
  --ink-2:#4a5260;
  --muted:#7a8290;
  --line:#e1e5ea;
  --line-2:#eef1f4;
  --band:#f5f7f9;
  --d0:#2a78d6; --d1:#eb6834; --d2:#1baf7a; --d3:#eda100; /* Nội Thận · Nội tiết · Tim mạch · Nội TQ */
  --live:#0b8f0b;
  --now:#d03b3b;
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1215; --surface:#171b20; --ink:#eef1f4; --ink-2:#b4bcc8; --muted:#848d9b;
    --line:#2a3038; --line-2:#222831; --band:#1b2026;
    --d0:#3987e5; --d1:#d95926; --d2:#199e70; --d3:#c98500; --live:#3cc43c; --now:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1215; --surface:#171b20; --ink:#eef1f4; --ink-2:#b4bcc8; --muted:#848d9b;
  --line:#2a3038; --line-2:#222831; --band:#1b2026;
  --d0:#3987e5; --d1:#d95926; --d2:#199e70; --d3:#c98500; --live:#3cc43c; --now:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num,.axis,.meta,.state,.next,.dchip,.hd{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 40px}
[hidden]{display:none !important}
.d0{--c:var(--d0)} .d1{--c:var(--d1)} .d2{--c:var(--d2)} .d3{--c:var(--d3)}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;display:inline-block}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand site" "tabs tabs";gap:10px 12px;align-items:center;margin-bottom:12px}
@media (min-width:760px){.top{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"brand tabs site";gap:16px}}
.brand{grid-area:brand;min-width:0}
h1{font-size:19px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.sub .wide{display:none}
@media (min-width:760px){.sub .wide{display:inline}}
.segc{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px}
.segc button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.segc button[aria-pressed="true"],.segc button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
#siteSeg{grid-area:site}
.tabs{grid-area:tabs;display:flex}
.tabs button{flex:1}
@media (min-width:760px){.tabs{display:inline-flex}.tabs button{flex:none;padding-inline:16px}}

.banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--now);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}

/* khoa */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip:disabled{opacity:.45;cursor:default}
.chip svg{width:13px;height:13px;flex:none}

/* dải ngày */
.dstrip{display:flex;gap:5px;overflow-x:auto;padding:8px 16px 8px;margin:0 -16px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dchip{position:relative;flex:none;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0 6px;display:grid;justify-items:center;gap:0}
.dchip.wk{margin-left:9px}
.dchip .dw{font-size:10.5px;color:var(--muted);font-weight:500;line-height:1.3}
.dchip .dn{font-size:16px;font-weight:600;line-height:1.25}
.dchip .dc{font-size:10.5px;color:var(--muted);line-height:1.3}
.dchip.is-past{opacity:.55}
.dchip.is-partial{background:repeating-linear-gradient(135deg,var(--surface) 0 5px,var(--line-2) 5px 7px)}
.dchip.is-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.dchip.is-sel{background:var(--ink);border-color:var(--ink);color:var(--surface);opacity:1}
.dchip.is-sel .dw,.dchip.is-sel .dc{color:var(--surface);opacity:.75}
.dp{position:absolute;top:-6px;right:-4px;background:var(--ink);color:var(--surface);border:1.5px solid var(--bg);border-radius:999px;font-size:9.5px;font-weight:700;line-height:1;padding:2px 4px;display:inline-flex;align-items:center;gap:1px}
.dp svg{width:8px;height:8px}
.dchip.is-sel .dp{background:var(--surface);color:var(--ink)}
.best{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--ink-2);margin:2px 0 12px}
.best svg{width:12px;height:12px;vertical-align:-1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.pill.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill b{color:var(--ink)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty{padding:28px 8px;text-align:center;color:var(--ink-2)}
.note{background:var(--band);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}

/* ngày */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:4px}
.dayhead h2{font-size:18px;margin:0;font-weight:700}
.daystats{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:13px;margin-bottom:8px}
.daystats b{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-vip{width:16px;height:9px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--ink-2) 0 3px,color-mix(in srgb,var(--ink-2) 35%,var(--surface)) 3px 5px)}
.lg-hol{width:16px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--muted)}
.lg-now{width:2px;height:12px;background:var(--now);border-radius:1px}

.axis-row,.trow{display:grid;grid-template-columns:minmax(0,1fr);column-gap:16px}
.axis-row{position:sticky;top:0;background:var(--surface);z-index:2;padding:6px 0 4px;border-bottom:1px solid var(--line)}
.trow{grid-template-areas:"who" "track" "meta"}
@media (min-width:700px){
  .trow{grid-template-columns:250px minmax(0,1fr);grid-template-areas:"who track" "who meta";align-items:center}
  .axis-row{grid-template-columns:250px minmax(0,1fr)}
  .axis-row .axis{grid-column:2}
}
.axis{position:relative;height:16px;font-size:11px;color:var(--muted)}
.axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.axis span.first{transform:none}
.axis span.last{transform:translateX(-100%)}
@media (max-width:519px){.axis span.odd{display:none}}
.sec{margin-top:10px}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 0 2px;text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.sec-h .ct{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.sec-h .chev{margin-left:auto;color:var(--muted);font-size:11px}
div.sec-h{cursor:default}
.subh{font-size:11.5px;color:var(--muted);font-weight:500;padding:8px 0 0}
.trow{padding:8px 0;border-bottom:1px solid var(--line-2)}
.trow:last-child{border-bottom:0}
.who{grid-area:who;display:flex;align-items:flex-start;gap:6px;min-width:0}
.wb{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;min-width:0}
.dname{border:0;background:transparent;padding:2px 0;text-align:left;min-width:0;display:inline-flex;flex-wrap:wrap;column-gap:5px;align-items:baseline}
.dname:hover .dn{text-decoration:underline;text-underline-offset:3px}
.dt{font-size:11px;color:var(--muted);font-weight:500}
.dn{font-weight:600}
.anon .dn{font-weight:500;font-style:italic}
.pin{border:0;background:transparent;padding:4px;margin:-2px 0 -4px -4px;color:var(--muted);display:inline-flex;border-radius:6px;flex:none}
.pin:hover,.pin[aria-pressed="true"]{color:var(--ink)}
.pin svg{width:16px;height:16px}
.pin.ghost{visibility:hidden}
.state{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-2)}
.state.live{color:var(--live);border-color:currentColor}
.state.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.state.done{color:var(--muted)}
.trow.is-done .track,.trow.is-done .dn{opacity:.5}
.track{grid-area:track;position:relative;height:16px;margin:5px 0 4px;border-radius:4px;background:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--step))}
@media (min-width:700px){.track{margin:2px 0}}
.lunch{position:absolute;top:-4px;bottom:-4px;background:var(--band)}
.bar{position:absolute;top:1px;height:14px;border-radius:4px;z-index:1;background:var(--c)}
.bar.vip{background:repeating-linear-gradient(135deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 45%,var(--surface)) 4px 7px)}
.bar.hol{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.nowline{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--now);border-radius:1px;z-index:3}
.meta{grid-area:meta;font-size:12px;color:var(--ink-2)}
.meta i{font-style:normal;color:var(--muted)}

/* bác sĩ */
.tools{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1 1 auto;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 32px 9px 34px;font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:6px 8px;font-size:15px;line-height:1}
.tools select{flex:none;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 8px;max-width:42%}
.dl-head,.drow{display:grid;grid-template-columns:minmax(0,1fr);column-gap:18px}
.drow{grid-template-areas:"who" "strip" "next";row-gap:5px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.dl-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 0}
.dl-head .lbl{display:none;font-size:11px;color:var(--muted);font-weight:500}
@media (min-width:900px){
  .dl-head,.drow{grid-template-columns:270px minmax(0,1fr) 250px;align-items:center}
  .drow{grid-template-areas:"who strip next"}
  .dl-head .lbl{display:block}
}
@media (max-width:899px){.dl-head .strip{grid-column:1}}
.strip{grid-area:strip;display:grid;gap:2px;align-items:end}
.dl-head .strip{grid-area:auto}
.strip .sp{width:3px}
.hd{text-align:center;font-size:10px;line-height:1.15;color:var(--ink-2)}
.hd b{display:block;font-weight:600;color:var(--ink)}
.hd.sun b{color:var(--muted);font-weight:500}
.hd i{font-style:normal;color:var(--muted);font-size:9.5px}
@media (max-width:599px){.hd i{display:none}}
.hd.today b{color:var(--surface);background:var(--ink);border-radius:4px}
.sc{display:flex;flex-direction:column;gap:2px;padding:2px 0;border:0;background:transparent;border-radius:4px;min-width:0}
button.sc:hover{background:var(--line-2)}
.sc i{height:5px;border-radius:2px;background:var(--line-2)}
.sc i.on{background:var(--c)}
.sc i.on.vip{background:repeating-linear-gradient(135deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 45%,var(--surface)) 3px 5px)}
.sc i.hol{background:transparent;box-shadow:inset 0 0 0 1.2px var(--muted)}
.sc.part{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line-2) 4px 6px)}
.sc.part i:not(.on):not(.hol){background:transparent}
.drow .who{grid-area:who}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.next{grid-area:next;font-size:12px;color:var(--ink-2)}
.next b{color:var(--ink);font-weight:600}
.detail{grid-column:1/-1;background:var(--band);border-radius:10px;padding:6px 8px;margin-top:2px;display:grid;gap:1px}
.detail button{border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px;display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;font-size:12.5px}
.detail button:hover{background:var(--surface)}
.detail .dd{font-weight:600}
.strip-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:6px}
.strip-key span{display:inline-flex;align-items:center;gap:6px}
.mini{display:inline-flex;flex-direction:column;gap:2px;width:14px}
.strip-key .mini{align-items:stretch;gap:2px}
.mini i{height:4px;border-radius:2px;background:var(--ink-2)}
.mini i:nth-child(2){opacity:.35}
.hintrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0 2px;font-size:13px;color:var(--ink-2)}
.linkbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}

footer{margin-top:20px;font-size:12px;color:var(--muted);display:grid;gap:4px;max-width:75ch}
footer a{color:var(--ink-2)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:7px;max-width:280px;opacity:0;transition:opacity .08s;white-space:pre-line}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Lịch khám Tâm Anh</h1>
      <p class="sub"><span id="subSite" class="wide"></span><span id="subRange"></span></p>
    </div>
    <div class="segc tabs" role="tablist" aria-label="Chế độ xem">
      <button role="tab" data-view="ngay" aria-selected="true">Theo ngày</button>
      <button role="tab" data-view="bac-si" aria-selected="false">Theo bác sĩ</button>
    </div>
    <div class="segc" id="siteSeg" role="group" aria-label="Cơ sở">
      <button data-site="0" aria-pressed="true">TP.HCM</button>
      <button data-site="1" aria-pressed="false">Quận 7</button>
    </div>
  </header>

  <div class="banner" id="stale" hidden></div>
  <div class="chips" id="chips" role="group" aria-label="Khoa"></div>

  <main>
    <section id="view-ngay">
      <div class="dstrip" id="dstrip" aria-label="Chọn ngày"></div>
      <div class="best" id="best"></div>
      <div class="card" id="dayPanel"></div>
    </section>

    <section id="view-bac-si" hidden>
      <div class="tools">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" placeholder="Tìm bác sĩ, gõ không dấu cũng được" aria-label="Tìm bác sĩ">
          <button class="clear" id="qclear" aria-label="Xoá tìm kiếm" hidden>×</button>
        </div>
        <select id="sort" aria-label="Sắp xếp">
          <option value="ten">Tên A–Z</option>
          <option value="gan">Lịch gần nhất</option>
          <option value="nhieu">Nhiều ngày nhất</option>
        </select>
      </div>
      <div class="card">
        <div class="strip-key">
          <span><span class="mini"><i></i><i></i><i></i></span>Mỗi cột một ngày: Sáng · Trưa · Chiều</span>
          <span><i class="lg-vip"></i>Phòng VIP</span>
          <span id="keyHol"><i class="lg-hol"></i>Khám ở cơ sở kia</span>
        </div>
        <div id="docList"></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="srcline"></div>
    <div>Nguồn: lịch đặt khám do Tâm Anh công bố tại <a href="https://tamanhhospital.vn/danh-cho-khach-hang/dat-lich-kham/">tamanhhospital.vn</a>, lấy ngày 12/11/2026. Lịch có thể thay đổi, nên gọi xác nhận trước khi đến: <span class="num">0287 102 6789</span> hoặc <span class="num">093 180 6858</span>.</div>
  </footer>
</div>

function spans(segs){
  const out=[];
  [...segs].sort((a,b)=>a.s-b.s).forEach(s=>{

}

}

}
function nameBtn(d, attr){
  return `<button class="dname${d.anon?" anon":""}" ${attr}><span class="dt">${esc(d.t)}</span><span class="dn">${esc(d.n)}</span></button>`;
}
function pinBtn(d){
  if(d.anon) return `<span class="pin ghost">${star(false)}</span>`;
  const on=state.pins.has(d.id);
  return `<button class="pin" data-pin="${d.i}" aria-pressed="${on}" aria-label="${on?"Bỏ ghim":"Ghim"} ${esc(d.n)}">${star(on)}</button>`;
}

/* ---------- khoa ---------- */
function renderChips(){
  const n=state.pins.size;
  let h=`<button class="chip" data-dept="all" aria-pressed="${state.dept==="all"}">Tất cả khoa</button>`;
  DEPTS.forEach((d,i)=>{ h+=`<button class="chip" data-dept="${i}" aria-pressed="${state.dept===i}"><i class="dot d${i}"></i>${d.short}</button>`; });
  h+=`<button class="chip" data-dept="pin" aria-pressed="${state.dept==="pin"}"${n?"":" disabled"}>${star(state.dept==="pin")}Đã ghim${n?" · "+n:""}</button>`;
  $("chips").innerHTML=h;
}

/* ---------- dải ngày ---------- */
let stripKey="";
function renderStrip(){
  const el=$("dstrip"), keep=el.scrollLeft;
  el.innerHTML = DAYS.map((d,i)=>{
    const n=uniq(dayRows(d).map(r=>r.doc)).length;
    const p=state.dept==="pin" ? 0 : pinDocs(d).length;
    const cls=["dchip", i&&wd(d)===1?"wk":"", d===state.date?"is-sel":"", d===NOW.date?"is-today":"", d<NOW.date?"is-past":"", PARTIAL.has(d)?"is-partial":""].join(" ");
    const label=`${WD_LONG[wd(d)]} ${dm(d)}: ${n} bác sĩ${p?", "+p+" bác sĩ đã ghim":""}${PARTIAL.has(d)?", lịch chưa công bố đủ":""}`;
    return `<button class="${cls}" data-date="${d}" aria-pressed="${d===state.date}" aria-label="${label}"><span class="dw">${WD[wd(d)]}</span><span class="dn">${+d.slice(8)}</span><span class="dc">${n||"–"}</span>${p?`<span class="dp">${star(true)}${p}</span>`:""}</button>`;
  }).join("");
  const key=state.date+"|"+state.site;
  if(key!==stripKey){
    stripKey=key;
    const sel=el.querySelector(".is-sel");
    if(sel) el.scrollLeft = sel.offsetLeft - el.offsetLeft - (el.clientWidth-sel.offsetWidth)/2;
  } else el.scrollLeft=keep;
}
function renderBest(){
  const el=$("best");
  if(!state.pins.size){
    el.innerHTML=`<span>Số dưới mỗi ngày là số bác sĩ khám. Bấm ${star(false)} cạnh tên để ghim bác sĩ cần gặp.</span>`;
    return;
  }
  const total=DOCS.filter(d=>state.pins.has(d.id) && d.sess.some(s=>s.site===state.site)).length;
  const rows=DAYS.filter(d=>d>=NOW.date).map(d=>({d,n:pinDocs(d).length})).filter(r=>r.n).sort((a,b)=>b.n-a.n||a.d.localeCompare(b.d)).slice(0,3);
  if(!rows.length){ el.innerHTML=`<span>${star(true)} Các bác sĩ đã ghim không còn lịch tại ${SITES[state.site].short} đến ${dm(DAYS[DAYS.length-1])}.</span>`; return; }
  el.innerHTML=`<span>${star(true)} Gặp được nhiều BS đã ghim nhất:</span>`+rows.map(r=>`<button class="pill" data-date="${r.d}">${dayLabel(r.d,true)} · <b>${r.n}/${total}</b></button>`).join("");
}

/* ---------- theo ngày ---------- */
function renderDay(){
  const el=$("dayPanel"), d=state.date, isToday=d===NOW.date;
  const rows=dayRows(d), docs=uniq(rows.map(r=>r.doc));
  const backBtn=(!isToday && DAYS.includes(NOW.date)) ? `<button class="pill" data-date="${NOW.date}">Về hôm nay</button>` : "";
  let h=`<div class="dayhead"><h2>${WD_LONG[wd(d)]}, ${dm(d)}</h2>${isToday?'<span class="pill solid">Hôm nay</span>':""}${backBtn}</div>`;
  if(PARTIAL.has(d)) h+=`<div class="note">Ngày ${dm(d)} bệnh viện gần như chưa công bố lịch. Danh sách bên dưới chưa đầy đủ.</div>`;
  if(!rows.length){
    const scope = state.dept==="pin" ? "Các bác sĩ đã ghim" : state.dept==="all" ? "Các khoa" : DEPTS[state.dept].name;
    el.innerHTML=h+`<div class="empty">${scope} không có lịch khám tại ${SITES[state.site].short} ngày ${dm(d)}.</div>`;
    return;
  }
  // dữ liệu vẽ cho từng dòng
  rows.forEach(r=>{
    r.all=r.doc.sess.filter(s=>s.date===d);
    r.here=r.all.filter(s=>s.site===state.site);
    r.sp=spans(r.segs);
    r.pinned=state.pins.has(r.doc.id);
  });
  const maxEnd=Math.max(...rows.flatMap(r=>r.all.map(s=>s.e)));
  const D1=(maxEnd>16*60?19:16)*60, P=m=>((m-D0)/(D1-D0))*100;
  const anyHol=rows.some(r=>r.all.some(s=>s.site!==state.site));
  const caN=[0,1,2].map(c=>uniq(rows.filter(r=>r.segs.some(s=>s.ca===c && s.s<960)).map(r=>r.doc)).length);
  const lateN=uniq(rows.filter(r=>r.segs.some(s=>s.s>=960)).map(r=>r.doc)).length;
  h+=`<div class="daystats"><span><b class="num">${docs.length}</b> bác sĩ</span><span>Sáng <b class="num">${caN[0]}</b></span><span>Trưa <b class="num">${caN[1]}</b></span><span>Chiều <b class="num">${caN[2]}</b></span>${lateN?`<span>Ngoài giờ <b class="num">${lateN}</b></span>`:""}</div>`;
  const nowOn=isToday && NOW.min>=D0 && NOW.min<=D1;
  h+=`<div class="legend"><span><i class="lg-vip"></i>Phòng VIP</span>${anyHol?`<span><i class="lg-hol"></i>Khám ở ${SITES[other()].short}</span>`:""}${nowOn?`<span><i class="lg-now"></i>Bây giờ ${fmt(NOW.min)}</span>`:""}</div>`;
  let axis="";
  for(let t=6;t<=D1/60;t++) axis+=`<span class="${t===6?"first":""} ${t===D1/60?"last":""} ${t%2?"odd":""}" style="left:${P(t*60)}%">${t}h</span>`;
  h+=`<div class="axis-row"><div class="axis">${axis}</div></div>`;
  const step=(100/((D1-D0)/60)).toFixed(4)+"%";
  const multi=state.dept==="all"||state.dept==="pin";
  const rowHtml=r=>{
    const st=liveState(blocks(r.here), d);
    const bars=groupsOf(r.all).map(g=>spans(g.segs).map(x=>{
      const hol=g.site!==state.site;
      const tipTxt=`${r.doc.n}\n${fmt(x.s)}–${fmt(x.e)} · ${roomLabel(x.room,x.vip)}\n${DEPTS[g.dept].name}${hol?" · "+SITES[g.site].short:""}`;
      return `<span class="bar ${hol?"hol":"d"+g.dept+(x.vip?" vip":"")}" style="left:${P(x.s)}%;width:calc(${P(x.e)-P(x.s)}% - 2px)" data-tip="${esc(tipTxt)}"></span>`;
    }).join("")).join("");
    const extra=groupsOf(r.all.filter(s=>!(s.site===state.site && s.dept===r.dept))).map(g=>`${g.site!==state.site?SITES[g.site].short:DEPTS[g.dept].short} ${blocks(g.segs).map(x=>fmt(x.s)+"–"+fmt(x.e)).join(", ")}`).join("; ");
    return `<div class="trow${st&&st.cls==="done"?" is-done":""}">
      <div class="who">${pinBtn(r.doc)}<div class="wb">${nameBtn(r.doc,`data-open="${r.doc.i}" title="Xem cả tháng của bác sĩ này"`)}${st?`<span class="state ${st.cls}">${st.txt}</span>`:""}</div></div>
      <div class="track" style="--step:${step}"><span class="lunch" style="left:${P(720)}%;width:${P(780)-P(720)}%"></span>${bars}${nowOn?`<span class="nowline" style="left:${P(NOW.min)}%"></span>`:""}</div>
      <div class="meta">${esc(spanText(r.sp))}${extra?` <i>· cùng ngày: ${esc(extra)}</i>`:""}</div>
    </div>`;
  };
  const order=(a,b)=>b.pinned-a.pinned || a.sp[0].s-b.sp[0].s || vcmp(a.doc,b.doc);
  DEPTS.forEach((dep,k)=>{
    const list=rows.filter(r=>r.dept===k).sort(order);
    if(!list.length) return;
    const closed=multi && state.collapsed.has(k);
    h+=`<div class="sec">`;
    if(multi) h+=`<button class="sec-h" data-collapse="${k}" aria-expanded="${!closed}"><i class="dot d${k}"></i>${dep.name}<span class="ct">· ${list.length} BS</span><span class="chev">${closed?"Mở ▸":"▾"}</span></button>`;
    if(!closed){
      const subs=uniq(list.map(r=>r.sub)).sort();
      subs.forEach(sb=>{
        if(subs.length>1) h+=`<div class="subh">${SUBS[sb]} · ${list.filter(r=>r.sub===sb).length}</div>`;
        h+=list.filter(r=>r.sub===sb).map(rowHtml).join("");
      });
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
}

/* ---------- theo bác sĩ ---------- */
const matchQ = d => { const q=norm(state.q.trim()); return !q || q.split(/\s+/).every(w=>d.key.includes(w)); };
function nextOf(here){
  for(const d of uniq(here.map(s=>s.date)).sort()){
    if(d<NOW.date) continue;
    const sp=spans(here.filter(s=>s.date===d));
    const rest=d===NOW.date ? sp.filter(x=>x.e>NOW.min) : sp;
    if(rest.length) return {d, sp:rest, live:d===NOW.date && rest[0].s<=NOW.min};
  }
  return null;
}
const mode = a => { const c=new Map(); a.forEach(x=>c.set(x,(c.get(x)||0)+1)); return [...c.entries()].sort((x,y)=>y[1]-x[1])[0][0]; };
const STRIP_T = DAYS.map((d,i)=>(i&&wd(d)===1?"3px ":"")+"minmax(0,1fr)").join(" ");
const stripCells = fn => DAYS.map((d,i)=>(i&&wd(d)===1?`<span class="sp"></span>`:"")+fn(d)).join("");
function renderDocs(){
  const el=$("docList");
  const pinMode=state.dept==="pin", one=typeof state.dept==="number";
  const base=DOCS.filter(d=>matchQ(d) && (!pinMode || state.pins.has(d.id)));
  const list=base.map(d=>{
    const here=d.sess.filter(s=>s.site===state.site);
    if(!here.length) return null;
    if(one && !here.some(s=>s.dept===state.dept)) return {d, out:true};
    const gd=one ? state.dept : mode(here.map(s=>s.dept));
    const inDept=here.filter(s=>s.dept===gd);
    return {d, here, gd, gs:mode(inDept.map(s=>s.sub)), nDays:uniq(here.map(s=>s.date)).length, next:nextOf(here), away:d.sess.some(s=>s.site!==state.site)};
  }).filter(Boolean);
  const shown=list.filter(x=>!x.out);
  const otherDept=list.length-shown.length, otherSite=base.filter(d=>!d.sess.some(s=>s.site===state.site) && (!one || d.sess.some(s=>s.dept===state.dept))).length;
  $("keyHol").hidden = !shown.some(x=>x.away);
  const sorters={
    ten:(a,b)=>vcmp(a.d,b.d),
    nhieu:(a,b)=>b.nDays-a.nDays || vcmp(a.d,b.d),
    gan:(a,b)=>{
      if(!a.next||!b.next) return (a.next?-1:0)-(b.next?-1:0) || vcmp(a.d,b.d);
      return a.next.d.localeCompare(b.next.d) || a.next.sp[0].s-b.next.sp[0].s || vcmp(a.d,b.d);
    }
  };
  shown.sort(sorters[state.sort]);
  let h=`<div class="dl-head"><span class="lbl">Bác sĩ</span><div class="strip" style="grid-template-columns:${STRIP_T}">${stripCells(d=>`<span class="hd${d===NOW.date?" today":""}${wd(d)===0?" sun":""}"><b>${+d.slice(8)}</b><i>${WD[wd(d)]}</i></span>`)}</div><span class="lbl">Lịch kế tiếp tại ${SITES[state.site].short}</span></div>`;
  const rowHtml=x=>{
    const d=x.d, open=state.open.has(d.i);
    const strip=stripCells(day=>{
      const ss=d.sess.filter(s=>s.date===day), hs=ss.filter(s=>s.site===state.site), os=ss.filter(s=>s.site!==state.site);
      const bars=[0,1,2].map(c=>{
        const s=hs.find(v=>v.ca===c);
        if(s) return `<i class="on d${s.dept}${s.vip?" vip":""}"></i>`;
        return os.some(v=>v.ca===c) ? `<i class="hol"></i>` : `<i></i>`;
      }).join("");
      const cls=`sc${PARTIAL.has(day)?" part":""}${day===NOW.date?" today":""}`;
      if(!ss.length) return `<span class="${cls}" data-tip="${WD[wd(day)]} ${dm(day)}: ${PARTIAL.has(day)?"lịch chưa công bố đủ":"không khám"}">${bars}</span>`;
      const tipTxt=`${WD[wd(day)]} ${dm(day)}\n`+groupsOf(ss).map(g=>spanText(spans(g.segs))+(g.site!==state.site?" · tại "+SITES[g.site].short:"")).join("\n");
      return `<button class="${cls}" data-date="${day}" data-gosite="${hs.length?state.site:other()}" data-tip="${esc(tipTxt)}" aria-label="${esc(tipTxt.replace(/\n/g,"; "))}">${bars}</button>`;
    });
    let nx;
    if(!x.next) nx=`Hết lịch tại ${SITES[state.site].short} đến ${dm(DAYS[DAYS.length-1])}`;
    else if(x.next.live) nx=`<span class="state live" style="margin-right:4px">Đang khám</span>đến <b>${fmt(x.next.sp[0].e)}</b> · ${esc(roomLabel(x.next.sp[0].room,x.next.sp[0].vip))}`;
    else nx=`Kế tiếp: <b>${dayLabel(x.next.d,true)}</b> · ${esc(spanText(x.next.sp))}`;
    const manyDept=uniq(d.sess.map(s=>s.dept)).length>1;
    const detail=open ? `<div class="detail">${uniq(d.sess.map(s=>s.date)).sort().map(day=>{
      const gs=groupsOf(d.sess.filter(s=>s.date===day));
      const txt=gs.map(g=>spanText(spans(g.segs))+(manyDept?" · "+DEPTS[g.dept].short:"")+(g.site!==state.site?" · tại "+SITES[g.site].short:"")).join("; ");
      return `<button data-date="${day}" data-gosite="${gs.some(g=>g.site===state.site)?state.site:other()}"><span class="dd">${WD[wd(day)]} ${dm(day)}</span><span>${esc(txt)}</span></button>`;
    }).join("")}</div>` : "";
    return `<div class="drow" id="doc-${d.i}">
      <div class="who">${pinBtn(d)}<div class="wb">${nameBtn(d,`data-toggle="${d.i}" aria-expanded="${open}"`)}${x.away?`<span class="tag">+ ${SITES[other()].short}</span>`:""}</div></div>
      <div class="strip" style="grid-template-columns:${STRIP_T}">${strip}</div>
      <div class="next">${nx}</div>${detail}
    </div>`;
  };
  if(!shown.length) h+=`<div class="empty">Không có bác sĩ nào khớp tại ${SITES[state.site].short}${one?" · "+DEPTS[state.dept].name:""}.</div>`;
  DEPTS.forEach((dep,k)=>{
    const grp=shown.filter(x=>x.gd===k);
    if(!grp.length) return;
    h+=`<div class="sec">`;
    if(!one) h+=`<div class="sec-h"><i class="dot d${k}"></i>${dep.name}<span class="ct">· ${grp.length} BS</span></div>`;
    const subs=uniq(grp.map(x=>x.gs)).sort();
    subs.forEach(sb=>{
      if(subs.length>1) h+=`<div class="subh">${SUBS[sb]} · ${grp.filter(x=>x.gs===sb).length}</div>`;
      h+=grp.filter(x=>x.gs===sb).map(rowHtml).join("");
    });
    h+=`</div>`;
  });
  if((state.q.trim()||pinMode) && (otherDept||otherSite)){
    h+=`<div class="hintrow">`;
    if(otherDept) h+=`<span>${otherDept} bác sĩ khớp ở khoa khác.</span><button class="linkbtn" data-dept="all">Xem tất cả khoa</button>`;
    if(otherSite) h+=`<span>${otherSite} bác sĩ khớp chỉ khám ở ${SITES[other()].short}.</span><button class="linkbtn" data-site="${other()}">Xem ${SITES[other()].short}</button>`;
    h+=`</div>`;
  }
  el.innerHTML=h;
}

/* ---------- khung ---------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===state.view)));
  document.querySelectorAll("#siteSeg button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.site===state.site)));
  $("view-ngay").hidden = state.view!=="ngay";
  $("view-bac-si").hidden = state.view!=="bac-si";
  $("subSite").textContent = SITES[state.site].name+" · ";
  $("subRange").textContent = "Lịch "+RANGE_TXT;
  $("qclear").hidden = !state.q;
  $("sort").value = state.sort;
  renderChips();
  if(state.view==="ngay"){ renderStrip(); renderBest(); renderDay(); }
  else renderDocs();
}
function setView(v){
  state.view=v;
  try{ if(location.hash!=="#"+v) history.replaceState(null,"","#"+v); }catch(e){}
  render();
  window.scrollTo({top:0});
}
function goDate(d, site){
  if(site===0||site===1) state.site=site;
  state.date=d; saveUi();
  if(state.view!=="ngay") setView("ngay"); else render();
}

document.addEventListener("click", e=>{
  const t=e.target.closest("button");
  if(!t) return;
  const ds=t.dataset;
  if(ds.view){ setView(ds.view); return; }
  if(ds.date){ hideTip(); goDate(ds.date, ds.gosite!==undefined ? +ds.gosite : undefined); return; }
  if(ds.site!==undefined){ state.site=+ds.site; saveUi(); render(); return; }
  if(ds.dept!==undefined){ state.dept = ds.dept==="all"||ds.dept==="pin" ? ds.dept : +ds.dept; saveUi(); render(); return; }
  if(ds.pin!==undefined){
    const id=DOCS[+ds.pin].id;
    state.pins.has(id) ? state.pins.delete(id) : state.pins.add(id);
    if(!state.pins.size && state.dept==="pin") state.dept="all";
    store.set("ta-lich-pins",[...state.pins]); saveUi(); render(); return;
  }
  if(ds.collapse!==undefined){ const k=+ds.collapse; state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k); saveUi(); render(); return; }
  if(t.id==="qclear"){ state.q=""; $("q").value=""; render(); return; }
  if(ds.open!==undefined){
    state.open=new Set([+ds.open]); state.q=""; $("q").value="";
    setView("bac-si");
    const row=$("doc-"+ds.open);
    if(row) row.scrollIntoView({block:"center"});
    return;
  }
  if(ds.toggle!==undefined){ const i=+ds.toggle; state.open.has(i)?state.open.delete(i):state.open.add(i); render(); return; }
});
$("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
$("sort").addEventListener("change", e=>{ state.sort=e.target.value; saveUi(); render(); });
window.addEventListener("hashchange", ()=>{ const v=location.hash.slice(1); if((v==="ngay"||v==="bac-si") && v!==state.view){ state.view=v; render(); } });
setInterval(()=>{ if(document.hidden) return; const n=vnNow(); if(n.date!==NOW.date||n.min!==NOW.min){ NOW=n; if(state.view==="ngay"||!state.q) render(); } }, 60000);

/* tooltip (chuột) */
const tip=$("tip");
function hideTip(){ tip.style.opacity=0; }
document.addEventListener("pointermove", e=>{
  if(e.pointerType!=="mouse") return;
  const t=e.target.closest("[data-tip]");
  if(!t){ hideTip(); return; }
  tip.textContent=t.dataset.tip;
  const w=tip.offsetWidth, hgt=tip.offsetHeight;
  let x=e.clientX+12, y=e.clientY+14;
  if(x+w>innerWidth-8) x=e.clientX-w-12;
  if(y+hgt>innerHeight-8) y=e.clientY-hgt-12;
  tip.style.left=x+"px"; tip.style.top=y+"px"; tip.style.opacity=1;
});
document.addEventListener("scroll", hideTip, {passive:true});

(function init(){
  const named=DOCS.filter(d=>!d.anon).length;
  $("srcline").textContent=`Dữ liệu ${RANGE_TXT}: ${named} bác sĩ, ${SESS.length.toLocaleString("vi-VN")} ca tại 2 cơ sở, 4 khoa. Tim mạch (TTTM) gồm Tim mạch, Tim mạch can thiệp và Ngoại Tim mạch. Sáng bắt đầu trước 12:00, Trưa 12:00–13:00, Chiều từ 13:00, Ngoài giờ từ 16:00. Một số ca VIP ở Quận 7 do bác sĩ trực đảm nhận, bệnh viện chưa công bố tên.`;
  if(NOW.date>DAYS[DAYS.length-1]){
    const b=$("stale"); b.hidden=false;
    b.textContent=`Lịch này chỉ đến ${dm(DAYS[DAYS.length-1])}. Cần lấy lịch mới từ bệnh viện để xem các ngày sau.`;
  }
  if(location.hash.slice(1)==="bac-si") state.view="bac-si";
  render();
})();
</script>
</body>
</html>
